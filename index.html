  <style>
    :root {
      --bg: #f8fafc;          /* light background */
      --surface: #ffffff;      /* cards */
      --fg: #0f172a;           /* text */
      --muted: #475569;        /* secondary text */
      --line: #e2e8f0;         /* borders */
      --accent: #0ea5e9;       /* blue */
      --accent-ink: #075985;   /* dark blue */
      --shadow: 0 8px 24px rgba(2, 6, 23, .08);
    }
    html[data-theme="dark"] {
      --bg: #0b1020; --surface:#0f172a; --fg:#e5e7eb; --muted:#9aa4b2; --line:#1f2937; --accent:#38bdf8; --accent-ink:#e0f2fe; --shadow:0 8px 24px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  font-size: 14px;   /* smaller body text */
}

a { color: var(--accent); text-decoration: none; }
a:hover, a:focus { text-decoration: underline; }
img { max-width: 100%; display: block; }

.wrap {
  max-width: 980px;
  margin: 0 auto;
  padding: 28px clamp(16px, 3vw, 28px) 80px;
}

/* Header */
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 14px; }
.avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line); box-shadow: var(--shadow); }
.title { font-weight: 700; font-size: 12px; }   /* smaller name */
nav a { margin-left: 16px; font-weight: 600; font-size: 13px; }  /* smaller nav links */
@media (max-width: 640px){ nav { display: none; } }

/* Hero */
.hero { margin: 48px 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; }
.hero h1 { font-size: clamp(22px, 4vw, 36px); line-height: 1.15; margin: 0 0 8px; } /* smaller main heading */
.lead { font-size: clamp(16px, 2vw, 18px); color: var(--muted); } /* smaller intro text */
.hero-img { width: 100%; border-radius: 18px; border: 1px solid var(--line); box-shadow: var(--shadow); object-fit: cover; }
@media (max-width: 860px){ .hero { grid-template-columns: 1fr; } }

/* Sections */
h2 { font-size: clamp(18px, 2vw, 22px); margin: 34px 0 12px; }  /* smaller section headings */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.card { background: var(--surface); padding: 18px; border-radius: 18px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.card h3 { margin: 6px 0 8px; font-size: 16px; }  /* smaller card titles */
.meta { color: var(--muted); font-size: 12px; }   /* smaller meta text */

/* Details */
details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
summary { cursor: pointer; font-weight: 600; }
pre { background: color-mix(in srgb, var(--accent) 8%, transparent); padding: 12px; border-radius: 12px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }

/* Footer */
footer { margin-top: 56px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.theme-toggle { border: 1px solid var(--line); background: var(--surface); color: var(--accent-ink); border-radius: 12px; padding: 6px 10px; font-size: 13px; }

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    (function(){
      const key = 'theme-preference';
      const root = document.documentElement;
      const btn = document.getElementById('themeToggle');
      const saved = localStorage.getItem(key);
      if (saved) root.setAttribute('data-theme', saved);
      btn.addEventListener('click', () => {
        const current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem(key, next);
      });
    })();
  </script>
